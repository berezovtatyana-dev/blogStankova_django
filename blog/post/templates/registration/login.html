{% extends 'post/base.html' %}
{% block title %} Войти {{ page_title }} {% endblock %}
{% block content %}
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        <div>
            <label>Имя пользователя</label>
            {{ form.username }}
        </div>
        <div>
            <label>Пароль</label>
            {{ form.password }}
        </div>
        <button type="submit">Войти</button>
    </form>
    <p>Не зарегистрирован аккаунт?
        <a href="{% url 'userAcc:register' %}">Зарегистрироваться</a>
    </p>
{% endblock %}
